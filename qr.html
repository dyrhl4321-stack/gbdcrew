<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근방단 QR코드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0a;color:#f0f0f0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}

.poster{background:#111;border:1px solid #222;padding:34px 30px 40px;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:430px;width:100%;position:relative;min-height:620px;}

/* 브랜드 */
.brand{text-align:center;}
.brand-mark{font-size:24px;font-weight:900;letter-spacing:.34em;color:#fff;text-indent:.34em;}
.brand-sub{font-size:12px;font-weight:700;letter-spacing:.22em;color:#c8f542;margin-top:6px;text-indent:.22em;}

/* 메인 출석 QR (히어로) */
.main-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}
.qr-box{background:#fff;padding:14px;border-radius:6px;line-height:0;}
.qr-box img,.qr-box canvas{display:block;max-width:100%;height:auto;}
.main-cta{font-size:13px;letter-spacing:.06em;color:#888;}
.main-cta b{color:#c8f542;font-weight:900;}

/* 인스타 궁금증 존 */
/* 우측 하단 코너로 몰기(메인 QR과 거리 확보 → 동시 인식 방지) + 작게 */
.insta-zone{position:absolute;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:3px;color:#c8f542;}
.curiosity{font-family:"Nanum Pen Script","Apple SD Gothic Neo",sans-serif;line-height:1.02;text-align:right;flex-shrink:0;padding-bottom:8px;}
.curio-1{display:block;font-size:15px;color:#777;}
.curio-2{display:block;font-size:19px;font-weight:400;color:#c8f542;}
.arrow{width:40px;height:38px;flex-shrink:0;color:#c8f542;}

.insta-card{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
.qr-box-sm{background:#fff;padding:6px;border-radius:4px;line-height:0;}
.qr-box-sm img,.qr-box-sm canvas{display:block;max-width:100%;height:auto;}
.insta-handle{font-size:11px;font-weight:900;letter-spacing:.04em;color:#eee;}
.insta-label{font-size:9px;letter-spacing:.12em;color:#555;}

.print-btn{padding:13px 34px;background:#c8f542;border:none;color:#000;font-size:12px;font-weight:900;letter-spacing:.2em;cursor:pointer;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin-top:6px;}

/* 인쇄: 흰 배경 + 검정, 스캔 최적화 */
@media print{
  body{background:#fff;padding:0;}
  .poster{border:none;background:#fff;max-width:none;padding:28px;gap:26px;}
  .brand-mark{color:#000;}
  .brand-sub{color:#222;}
  .main-cta{color:#333;}
  .main-cta b{color:#000;}
  .insta-zone{color:#000;border-top-color:#ccc;}
  .curio-1{color:#444;}
  .curio-2{color:#000;}
  .arrow{color:#000;}
  .insta-handle{color:#000;}
  .insta-label{color:#444;}
  .print-btn{display:none;}
}
</style>
</head>
<body>
<div class="poster">
  <div class="brand">
    <div class="brand-mark">GBD CREW</div>
    <div class="brand-sub">근방단 출석체크</div>
  </div>

  <div class="main-qr-wrap">
    <div id="qrcode-main" class="qr-box"></div>
    <div class="main-cta">📱 스캔 → 이름 선택 → <b>출석 완료</b></div>
  </div>

  <div class="insta-zone">
    <div class="curiosity">
      <span class="curio-1">근방단은</span>
      <span class="curio-2">뭐 하는 모임이게?</span>
    </div>
    <svg class="arrow" viewBox="0 0 62 58" fill="none" aria-hidden="true">
      <path d="M4 10 C 30 2, 52 14, 54 42" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M54 44 L 44 35 M54 44 L 56 31" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="insta-card">
      <div id="qrcode-insta" class="qr-box-sm"></div>
      <div class="insta-handle">@gbd_project</div>
      <div class="insta-label">인스타 구경하기</div>
    </div>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ 인쇄하기</button>
</div>

<script>
new QRCode(document.getElementById("qrcode-main"), {
  text: "https://dyrhl4321-stack.github.io/gbdcrew?mode=checkin",
  width: 340,
  height: 340,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
new QRCode(document.getElementById("qrcode-insta"), {
  text: "https://instagram.com/gbd_project",
  width: 76,
  height: 76,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
