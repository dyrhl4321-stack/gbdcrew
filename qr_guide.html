<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GBD QR 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0c0c0c; color:#fff;
  font-family:'Noto Sans KR', sans-serif;
  width:1080px; margin:0 auto;
}
.wrap { padding: 80px 80px 60px; background:#0c0c0c; }

.logo { text-align:center; margin-bottom:52px; }
.logo-title { font-size:48px; font-weight:900; letter-spacing:12px; color:#fff; margin-bottom:8px; }
.logo-sub { font-size:18px; color:#666; letter-spacing:4px; }

.meeting-info { text-align:center; font-size:26px; font-weight:700; color:#ccff00; margin:-32px 0 46px; letter-spacing:1px; }
.meeting-info .mi-sep { color:#444; margin:0 14px; font-weight:400; }

.section-title { font-size:34px; font-weight:900; color:#fff; margin-bottom:8px; }
.section-sub { font-size:20px; color:#888; margin-bottom:40px; line-height:1.6; }

.steps { display:flex; gap:32px; align-items:center; margin-bottom:52px; }
.step { flex:1; background:#111; border-radius:16px; overflow:hidden; border:1px solid #222; }
.step-header { padding:24px 28px 18px; border-bottom:1px solid #1a1a1a; min-height:150px; }
.step-num { font-size:13px; font-weight:700; letter-spacing:3px; color:#ccff00; margin-bottom:8px; }
.step-title { font-size:26px; font-weight:900; color:#fff; }
.step-desc { font-size:17px; color:#aaa; line-height:1.7; margin-top:6px; }

.phone { position:relative; background:#0a0a0a; }
.phone iframe { width:100%; height:720px; border:0; display:block; background:#0a0a0a; }
.live-tag {
  position:absolute; top:12px; right:14px; z-index:2;
  font-size:12px; font-weight:700; color:#8dff8d; letter-spacing:1px;
  background:rgba(0,0,0,.62); padding:4px 11px; border-radius:20px;
  display:flex; align-items:center; gap:6px; pointer-events:none;
}
.live-tag::before { content:""; width:7px; height:7px; border-radius:50%; background:#3dff3d; display:inline-block; animation:blink 1.4s infinite; }
@keyframes blink { 50% { opacity:.25; } }

.arrow { font-size:40px; color:#444; flex-shrink:0; }

.pw-box {
  background:#111; border:2px solid #ccff00;
  border-radius:16px; padding:36px 48px;
  margin-bottom:40px;
  display:flex; align-items:center; gap:32px;
}
.pw-icon { font-size:52px; flex-shrink:0; }
.pw-label { font-size:20px; color:#888; margin-bottom:10px; }
.pw-num { font-size:72px; font-weight:900; color:#ccff00; letter-spacing:16px; }

.warn-box {
  background:#1a1000; border:1px solid #664400;
  border-radius:12px; padding:28px 36px;
  font-size:20px; color:#ffaa44; line-height:1.9;
}
.warn-box strong { color:#ffcc00; font-size:22px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-title">GBD CREW</div>
    <div class="logo-sub">출석 시스템 이용 안내</div>
  </div>

  <div class="meeting-info">📅 <span id="mi-date">불러오는 중…</span><span class="mi-sep">·</span>📍 <span id="mi-place">—</span></div>

  <div class="section-title">QR 찍으면 이렇게 진행돼요</div>
  <div class="section-sub">인포 테이블 위 QR코드를 스캔해주세요 📲</div>

  <div class="steps">
    <div class="step">
      <div class="step-header">
        <div class="step-num">STEP 01</div>
        <div class="step-title">비밀번호 입력</div>
        <div class="step-desc">QR 스캔 후 4자리 비밀번호를 입력하세요</div>
      </div>
      <div class="phone">
        <span class="live-tag">LIVE</span>
        <iframe src="index.html?mode=checkin&preview=entry" title="비밀번호 입력 화면" loading="lazy" scrolling="no"></iframe>
      </div>
    </div>

    <div class="arrow">→</div>

    <div class="step">
      <div class="step-header">
        <div class="step-num">STEP 02</div>
        <div class="step-title">본인 이름 선택</div>
        <div class="step-desc">목록에서 본인 이름을 눌러 출석 완료!</div>
      </div>
      <div class="phone">
        <span class="live-tag">LIVE</span>
        <iframe src="index.html?mode=checkin&preview=names" title="본인 이름 선택 화면" loading="lazy" scrolling="no"></iframe>
      </div>
    </div>
  </div>

  <div class="pw-box">
    <div class="pw-icon">🔐</div>
    <div>
      <div class="pw-label" id="pw-label">이번 모임 비밀번호</div>
      <div class="pw-num" id="pw-num">----</div>
    </div>
  </div>

  <div class="warn-box">
    ⚠️ <strong>집결 시간 엄수 부탁드립니다</strong><br>
    <span id="warn-time">시작 시각</span> 기준 5분 초과 시 시스템에 의해 <strong>자동 지각 처리</strong>됩니다.<br>
    지각 누적 시 불이익이 발생할 수 있습니다.
  </div>

</div>

<!-- Firebase: 다가오는 모임 정보 자동 표시 (관리자 앱과 실시간 연동) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBAdgC1pYJ9bAEWGTO_UoP4C84Q1d_jVtw",
  authDomain: "gbdcrewcheck-2af48.firebaseapp.com",
  projectId: "gbdcrewcheck-2af48",
  storageBucket: "gbdcrewcheck-2af48.firebasestorage.app",
  messagingSenderId: "57726309639",
  appId: "1:57726309639:web:9bb1edc21cb48fdd49a1a2"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WD = ["일","월","화","수","목","금","토"];
const key = m => { const d = new Date(m.date); d.setHours(0,0,0,0); return d.getTime(); };

// 다가오는(오늘 이후) 모임 중 가장 가까운 것 → 없으면 가장 최신
function pickMeeting(list){
  const dated = list.filter(m => m.date && !isNaN(new Date(m.date)));
  if(!dated.length) return null;
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const up = dated.filter(m => key(m) >= t0.getTime()).sort((a,b)=>key(a)-key(b));
  return up.length ? up[0] : dated.sort((a,b)=>key(b)-key(a))[0];
}

function fmtKoTime(t){
  if(!t) return "";
  const [h,mm] = t.split(":").map(Number);
  const ampm = h < 12 ? "오전" : "오후";
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${ampm} ${h12}시${mm ? ` ${mm}분` : ""}`;
}

function render(m){
  const miDate = document.getElementById("mi-date");
  const miPlace = document.getElementById("mi-place");
  if(!m){ miDate.textContent = "예정된 모임 없음"; miPlace.textContent = "—"; return; }
  const [y,mo,da] = m.date.split("-").map(Number);
  const wd = WD[new Date(m.date).getDay()];
  miDate.textContent = `${y}.${String(mo).padStart(2,"0")}.${String(da).padStart(2,"0")} (${wd})`;
  miPlace.textContent = m.gym || "—";

  const typeLabel = m.type === "beong" ? "벙" : "정모";
  document.getElementById("pw-label").textContent = `${mo}.${da} ${typeLabel} 비밀번호`;
  const pw = (m.password || "").trim();
  document.getElementById("pw-num").textContent = pw || "----";

  const wt = fmtKoTime(m.startTime);
  if(wt) document.getElementById("warn-time").textContent = wt;
}

onSnapshot(collection(db, "gbd_meetings"),
  snap => render(pickMeeting(snap.docs.map(d => ({ id:d.id, ...d.data() })))),
  err => { console.error("모임 정보 로드 실패:", err); document.getElementById("mi-date").textContent = "정보를 불러오지 못했어요"; }
);
</script>
</body>
</html>
